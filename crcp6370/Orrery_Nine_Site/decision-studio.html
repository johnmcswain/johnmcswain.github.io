<style>
/* Decision Studio, live build. One full-window 3D stage is the system you run; glass panels float over it.
   Fog is the idea: components you did not trace sit inside smoke, and the floor grid only shows where you can see. */
:root{--red:#ff2e1f;--deep:#8e130c;--bone:#f2eee4;--bone2:#b8b2a6;--amber:#ffb000;--glass:rgba(6,1,1,.78);
  --head:"Be Vietnam Pro","Helvetica Neue",Arial,sans-serif;--sans:"Inter","Helvetica Neue",Arial,sans-serif;--mono:"Roboto Mono",Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--bone);font:14px/1.4 var(--sans);overflow:hidden}
#app{position:fixed;inset:0;overflow:hidden;background:#000}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font:500 11px var(--mono);padding:3px 8px;background:rgba(0,0,0,.72);border:1px solid rgba(242,238,228,.35);color:var(--bone);pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:5px;transition:opacity .3s}
.lbl.fog{color:var(--bone2);border-color:rgba(184,178,166,.25);font-style:italic}
.lbl.sym{border-color:var(--amber);color:var(--amber)}
.lbl.root{background:var(--red);color:#000;border-color:#000;font-weight:700}
.lbl.sel{outline:2px solid var(--bone);outline-offset:2px}
.lbl.was::after{content:"· was in fog";color:var(--amber);margin-left:5px}
#mix[hidden],#huep[hidden]{display:none}
#huep{position:absolute;left:18px;top:54px;z-index:6;width:270px;padding:12px 14px}
#huep label{display:grid;grid-template-columns:86px 1fr 30px;align-items:center;gap:8px;font:500 11px var(--mono);margin:7px 0}
#huep input[type=range]{width:100%;accent-color:var(--red)}
#huep h2{font-size:14px;margin-bottom:6px}
#huep .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#huep .wheel{height:8px;border:1px solid var(--bone);background:linear-gradient(90deg,#ff2e1f,#ffd21f,#3dff1f,#1fffd2,#1f6bff,#a01fff,#ff1fa0,#ff2e1f);margin:2px 0 4px}
.cost{position:absolute;transform:translate(-50%,-50%);z-index:2;pointer-events:none;font:700 13px var(--mono);color:var(--amber);text-shadow:0 0 4px #000,0 1px 0 #000;white-space:nowrap}
.cost.big{font-size:20px;color:#000;background:var(--red);padding:1px 7px;text-shadow:none}
.chart text{font:500 10px var(--mono);fill:var(--bone2)}.chart text.v{fill:var(--bone)}
.chart [data-tip]{cursor:default}.chart [data-tip]:hover,.chart [data-tip]:focus{outline:none;stroke:var(--bone);stroke-width:1.5}
.chart .tip{font:500 11px var(--mono);color:var(--bone);min-height:2.6em;margin-top:6px}
.chart .key{display:flex;gap:12px;font:500 10px var(--mono);color:var(--bone2);margin-bottom:6px}.chart .key i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
#mix{position:absolute;left:18px;top:54px;z-index:6;width:270px;padding:12px 14px}
#mix label{display:grid;grid-template-columns:86px 1fr 30px;align-items:center;gap:8px;font:500 11px var(--mono);margin:7px 0}
#mix input[type=range]{width:100%;accent-color:var(--red)}
#mix h2{font-size:14px;margin-bottom:6px}
#mix .row{display:flex;gap:8px;margin-top:10px}
.card.guide{border-color:var(--amber);box-shadow:5px 5px 0 var(--amber)}
.card.guide h2{color:var(--amber);font-size:15px}
.ico{display:inline-flex}.ico svg{display:block}
h1,h2,h3{font-family:var(--head);margin:0}
.brand{position:absolute;left:18px;top:16px;display:flex;align-items:center;gap:12px;z-index:3}
.brand h1{font-size:22px;font-weight:800;background:var(--bone);color:#000;padding:3px 12px;box-shadow:5px 5px 0 var(--red)}
.chip{font:500 11px var(--mono);border:1px solid var(--bone);padding:3px 9px;background:rgba(0,0,0,.6)}
.rail{position:absolute;right:16px;top:16px;bottom:16px;width:372px;max-width:calc(100vw - 32px);overflow:auto;display:flex;flex-direction:column;gap:12px;z-index:3;scrollbar-width:thin}
.card{background:var(--glass);border:2px solid var(--bone);padding:14px 16px;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.card h2{font-size:17px;font-weight:800;margin-bottom:8px}
.card h3{font-size:12px;font-weight:700;margin:12px 0 6px;display:flex;align-items:center;gap:6px}
p{margin:0 0 8px}.note{font-size:12px;color:var(--bone2)}
label{display:block;font-size:12px;color:var(--bone2);margin:8px 0 3px}
select,input{width:100%;font:14px var(--sans);color:var(--bone);background:#000;border:2px solid var(--bone);padding:8px 10px;border-radius:0}
button{font:700 13px var(--sans);color:#000;background:var(--red);border:2px solid #000;box-shadow:3px 3px 0 var(--bone);padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-align:left}
button:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--bone)}
button.ghost{background:rgba(0,0,0,.6);color:var(--bone);border-color:var(--bone);box-shadow:none;font-weight:600}
button.on{background:var(--bone);color:#000;box-shadow:3px 3px 0 var(--red)}
button.big{width:100%;justify-content:center;font:800 16px var(--head);padding:13px}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,.lbl:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.opts{display:grid;gap:6px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #4a4a4a;padding:7px 9px;background:rgba(0,0,0,.5)}
.opt small{display:block;color:var(--bone2);font-size:11px}
.opt b{font:500 12px var(--mono);white-space:nowrap}
.opt.on{border:2px solid var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:5px 9px;font-size:12px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles{position:absolute;left:18px;bottom:16px;display:grid;grid-template-columns:repeat(6,minmax(0,136px));gap:8px;z-index:3;max-width:calc(100vw - 420px)}
.tile{background:var(--glass);border:2px solid var(--bone);padding:8px 10px;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);min-width:0}
.tile span{display:block;font:500 10px var(--mono);color:var(--bone2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b{font:700 16px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis}
.tile b.bad{color:var(--red)}
.bar{height:5px;background:#2a2a2a;margin-top:5px}.bar i{display:block;height:100%;background:var(--bone)}.bar i.over{background:var(--red)}
.alert{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:min(560px,calc(100vw - 440px));z-index:4;background:var(--amber);color:#000;border:2px solid #000;box-shadow:7px 7px 0 var(--bone);padding:12px 16px}
.alert.trace{background:var(--red)}
.alert h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;margin:0 0 4px}
.alert p{margin:0;font-weight:600}
.alert .fuse{height:6px;background:rgba(0,0,0,.25);margin-top:9px}.alert .fuse i{display:block;height:100%;background:#000}
.legend{position:absolute;left:18px;top:62px;display:flex;gap:6px;flex-wrap:wrap;z-index:3;font:500 10px var(--mono)}
.legend span{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.6);border:1px solid rgba(184,178,166,.4);padding:2px 7px}
.legend i{width:8px;height:8px;display:inline-block}
.big-index{font:800 76px/1 var(--head);color:var(--red)}
.subs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:8px 0}
.subs div{border:1px solid #4a4a4a;padding:5px 6px;background:rgba(0,0,0,.5)}
.subs span{display:block;font:500 9px var(--mono);color:var(--bone2)}.subs b{font:700 15px var(--mono)}
table{width:100%;border-collapse:collapse;font-size:12px}th{font:700 10px var(--mono);color:var(--bone2);text-align:left;border-bottom:2px solid var(--red);padding:4px 5px 4px 0}td{padding:5px 5px 5px 0;border-bottom:1px solid #3a3a3a;vertical-align:top}
.log{font-size:12px;display:grid;gap:4px;max-height:130px;overflow:auto}.log div{border-left:2px solid var(--deep);padding-left:7px;color:var(--bone2)}
.speed{display:flex;gap:6px}.speed button{padding:5px 10px;font-size:12px}
.hint{position:absolute;left:18px;bottom:92px;font:500 11px var(--mono);color:var(--bone2);z-index:2}
@media (max-width:900px){.rail{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:46vh}.tiles{left:8px;bottom:auto;top:98px;grid-template-columns:repeat(3,minmax(0,1fr));max-width:calc(100vw - 16px)}.alert{width:calc(100vw - 16px);top:56px}.legend,.hint{display:none}.brand{left:8px;top:8px}}
@media (prefers-reduced-motion:reduce){.lbl{transition:none}}
</style>
<div id="app">
  <canvas id="gl" aria-label="3D view of the AI system you are running"></canvas>
  <div id="labels"></div>
  <div class="brand"><h1>Decision Studio</h1><span class="chip" id="phase">Design</span><button class="ghost" id="snd" style="padding:3px 9px;font:500 11px var(--mono)">Sound</button><button class="ghost" id="hueb" style="padding:3px 9px;font:500 11px var(--mono)">Hue</button></div>
  <div id="huep" class="card" hidden></div>
  <div id="mix" class="card" hidden></div>
  <div class="legend"><span><i style="background:#f2eee4"></i>Traced: You See Inside</span><span><i style="background:#3a1a18;outline:1px solid #b8b2a6"></i>Fog: No Tracing</span><span><i style="background:#ffb000"></i>Symptom</span><span><i style="background:var(--red)"></i>Root Cause</span></div>

  <div class="rail" id="rail"></div>
</div>

function pickTarget(type,want){const ok=G.list.filter(n=>DATA.incidents[type].kinds.includes(n.kind)).map(n=>n.id);if(!ok.length)return null;if(want&&ok.includes(want))return want;const un=ok.filter(id=>!S.traced[id]);const pool=un.length&&rnd()<0.8?un:ok;return pool[Math.floor(rnd()*pool.length)];}

  const st=(c?c.it.hour+":"+(c.fixAt!=null)+":"+(R.t<c.lockUntil)+":"+curTraced(c):"-")+"|"+R.records.length+"|"+(S.sel&&!c?G.N[S.sel].queue.length+"/"+G.N[S.sel].busy.length+"/"+G.N[S.sel].fails:"");
  if(st!==lastState){lastState=st;render();}
}

/* ---------- Start ---------- */
buildGraph();FX.rebuild();render();
if(FX.ok)FX.start();else $("hint").textContent="This browser could not start the 3D view. The controls still work.";
if(window.claude&&window.claude.use){window.claude.use("sample").then(s=>{if(s){sample=s;if(S.phase==="design"){S.gm="claude";render();}}}).catch(()=>{});}
function mixPanel(){
  const m=$("mix");m.innerHTML="";const rows=[["master","Master"],["hum","Hum"],["beep","Countdown"],["incident","Incidents"],["call","Your Calls"],["flow","Requests"]];
  m.append(h("h2",{},"Sound"));
  rows.forEach(([k,name])=>{const out=h("span",{},Math.round(SND.vol[k]*100)+"");const inp=h("input",{type:"range",min:"0",max:"100",step:"5",value:String(Math.round(SND.vol[k]*100)),"aria-label":name+" volume"});
    inp.addEventListener("input",()=>{SND.set(k,inp.value/100);out.textContent=inp.value;});inp.addEventListener("change",()=>{if(k!=="hum")SND.test(k);});m.append(h("label",{},name,inp,out));});
  m.append(h("div",{class:"row"},h("button",{class:"ghost",onclick:()=>{SND.toggle();mixPanel();sndLabel();}},SND.isOn()?"Mute All":"Unmute"),h("button",{class:"ghost",onclick:()=>{SND.reset();mixPanel();sndLabel();}},"Reset"),h("button",{class:"ghost",onclick:()=>{m.hidden=true;}},"Close")));
}
function sndLabel(){$("snd").textContent=SND.isOn()?"Sound":"Sound Off";}
sndLabel();
$("snd").addEventListener("click",()=>{const m=$("mix");$("huep").hidden=true;m.hidden=!m.hidden;if(!m.hidden)mixPanel();});
$("hueb").addEventListener("click",()=>{const m=$("huep");$("mix").hidden=true;m.hidden=!m.hidden;if(!m.hidden)huePanel();});
HUE.set("deg",HUE.st.deg);
["pointerdown","keydown"].forEach(ev=>addEventListener(ev,()=>SND.init(),{passive:true}));
window.__ds={S,get R(){return R;},set R(v){R=v;},get G(){return G;},get RP(){return RP;},FX,SND,act,begin,step,render,startReplay,replayFrame,startGuide,traceMid,DT};
})();
