<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBITA · high-fidelity build</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d13;overflow:hidden;
    font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#9fb0c8}
  canvas{display:block}
  #panel{position:fixed;top:14px;left:14px;background:rgba(10,13,19,.78);
    border:1px solid #26314a;border-radius:6px;padding:10px 14px;pointer-events:none}
  #panel h1{margin:0 0 6px;font-size:12px;letter-spacing:.18em;color:#e8eef8}
  #panel td{padding:0 0 1px 10px}#panel td:first-child{padding-left:0;color:#5f7191}
  /* The bottom band is ONE stacked flex column spanning the full width.
     Previously #keys (bottom-left) and #prov (bottom-right) were separate
     fixed elements on the same baseline, so they overlapped as soon as
     their combined natural width exceeded the viewport. Stacking removes
     the horizontal competition entirely: neither can ever collide, and
     both wrap normally at any width. The scrim keeps them legible over
     the starfield. */
  #footer{position:fixed;left:0;right:0;bottom:0;box-sizing:border-box;
    display:flex;flex-direction:column;gap:5px;padding:10px 14px 11px;
    pointer-events:none;
    background:linear-gradient(to top,rgba(10,13,19,.95) 25%,rgba(10,13,19,0))}
  #prov{align-self:flex-end;max-width:100%;text-align:right;
    color:#3d4c66;font-size:11px;line-height:1.5}
  #keys{max-width:100%;color:#5a6c8c;line-height:1.55}
  /* the same latent collision at the top: cap widths so the panel, legend
     and banner wrap instead of overlapping on narrow viewports */
  #panel{max-width:min(48vw,340px)}
  #lookup{max-width:min(92vw,660px);text-align:center;line-height:1.5}
  #legend{max-width:min(34vw,230px)}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="panel">
  <h1>ORBITA &middot; HF</h1>
  <table>
    <tr><td>source</td><td id="s-src">loading…</td></tr>
    <tr><td>group</td><td id="s-group">—</td></tr>
    <tr><td>objects</td><td id="s-count">—</td></tr>
    <tr><td>time</td><td id="s-time">—</td></tr>
    <tr><td>scale</td><td id="s-exag">—</td></tr>
    <tr><td>sound</td><td id="s-snd">off</td></tr>
  </table>
</div>
<div id="footer">
  <div id="prov">
    <div>elements: CelesTrak &middot; stars: HYG &middot; sun: computed ephemeris</div>
    <div>same tested core as the mandala build &mdash; this one trades the kaleidoscope for fidelity</div>
  </div>
  <div id="keys">drag rotate &middot; scroll zoom &middot; F focus &middot; G group &middot; T time &middot; E scale &middot; Space pause &middot; M sound</div>
</div>
<script type="module" src="./js/three/main.js"></script>
</body>
</html>
