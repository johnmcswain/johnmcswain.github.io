<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Avant-Garde Replicator · Animated</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  :root {
    --bone: #ece5d3;
    --ink: #1a1814;
    --rust: #b04a2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bone);
    color: var(--ink);
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  header {
    width: 100%;
    max-width: 720px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 900;
    font-size: 28px;
    letter-spacing: -0.5px;
    font-style: italic;
  }
  .meta {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.6;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 720px;
    justify-content: center;
  }
  button {
    background: transparent;
    border: 1.5px solid var(--ink);
    color: var(--ink);
    padding: 8px 14px;
    font-family: inherit;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button:hover {
    background: var(--ink);
    color: var(--bone);
  }
  button.active {
    background: var(--rust);
    border-color: var(--rust);
    color: var(--bone);
  }
  #canvas-wrap {
    border: 1px solid var(--ink);
    box-shadow: 8px 8px 0 var(--ink);
    background: white;
    padding: 0;
    line-height: 0;
  }
  .caption {
    max-width: 720px;
    text-align: center;
    font-size: 13px;
    font-style: italic;
    line-height: 1.6;
    padding: 0 16px;
  }
  .caption strong {
    font-style: normal;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 11px;
  }
  .caption .hint {
    display: block;
    margin-top: 6px;
    font-style: normal;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.55;
  }
</style>
</head>
<body>
  <header>
    <h1>Avant-Garde Replicator</h1>
    <span class="meta">p5.js · ambient + interactive</span>
  </header>

  <div class="controls" id="controls"></div>
  <div id="canvas-wrap"></div>
  <div class="caption" id="caption"></div>

<script>
const W = 600, H = 600;

// ============ Helpers ============
const lerpRGB = (a, b, t) => [
  a[0] + (b[0]-a[0])*t,
  a[1] + (b[1]-a[1])*t,
  a[2] + (b[2]-a[2])*t
];

// ============ Painting definitions ============
// Each painting has: id, label, title, artist, hint (interaction text),
//   init(p) — called once when selected
//   draw(p) — called every frame

const paintings = [
  // ============================================================
  // MONDRIAN — grid breathes, click empty cells to fill
  // ============================================================
  {
    id: 'mondrian',
    label: 'Mondrian · 1930',
    title: 'Composition II in Red, Blue, and Yellow',
    artist: 'Piet Mondrian, 1930',
    hint: 'Hover colors to deepen · click any cell to cycle palette',
    state: null,
    init(p) {
      // Cells defined by the 4 grid lines (2 vertical, 2 horizontal)
      // Cycle: white → red → blue → yellow → black → white
      const WHITE = [245,240,225];
      this.state = {
        palette: [WHITE, [206,32,41], [20,50,140], [245,200,50], [25,25,25]],
        cells: [
          { x:0,   y:0,   w:180, h:380, paletteIdx: 0 },
          { x:180, y:0,   w:380, h:380, paletteIdx: 1 },
          { x:560, y:0,   w:40,  h:380, paletteIdx: 0 },
          { x:0,   y:380, w:180, h:90,  paletteIdx: 0 },
          { x:180, y:380, w:380, h:90,  paletteIdx: 0 },
          { x:560, y:380, w:40,  h:90,  paletteIdx: 0 },
          { x:0,   y:470, w:180, h:130, paletteIdx: 2 },
          { x:180, y:470, w:380, h:130, paletteIdx: 0 },
          { x:560, y:470, w:40,  h:130, paletteIdx: 3 },
        ]
      };
    },
    draw(p) {
      p.background(245, 240, 225);
      const breath = (Math.sin(p.frameCount * 0.015) + 1) * 0.5; // 0..1
      const k = 8 + breath * 1.5; // line weight breathes 8..9.5
      const mx = p.mouseX, my = p.mouseY;

      p.noStroke();
      // Draw cells
      for (const c of this.state.cells) {
        let col = this.state.palette[c.paletteIdx];
        // Hover deepens only the saturated colors (not white or black)
        if (c.paletteIdx >= 1 && c.paletteIdx <= 3) {
          const hovered = mx >= c.x && mx <= c.x+c.w && my >= c.y && my <= c.y+c.h;
          if (hovered) {
            col = [col[0]*0.85, col[1]*0.85, col[2]*0.85];
          }
        }
        p.fill(col[0], col[1], col[2]);
        p.rect(c.x, c.y, c.w, c.h);
      }

      // Grid lines — breathing weight
      p.fill(15, 15, 15);
      p.rect(180 - k/2, 0, k, 600);
      p.rect(560 - k/2, 0, k, 600);
      p.rect(0, 380 - k/2, 600, k);
      p.rect(0, 470 - k/2, 600, k);
    },
    mousePressed(p) {
      const mx = p.mouseX, my = p.mouseY;
      for (const c of this.state.cells) {
        if (mx >= c.x && mx <= c.x+c.w && my >= c.y && my <= c.y+c.h) {
          c.paletteIdx = (c.paletteIdx + 1) % this.state.palette.length;
          break;
        }
      }
    }
  },

  // ============================================================
  // MALEVICH — black square drifts, repelled by mouse
  // ============================================================
  {
    id: 'malevich',
    label: 'Malevich · 1915',
    title: 'Black Square',
    artist: 'Kazimir Malevich, 1915',
    hint: 'Move mouse near square = drifts away · click to spawn orbiting debris',
    state: null,
    init(p) {
      this.state = {
        baseX: 95, baseY: 90,
        offX: 0, offY: 0,
        velX: 0, velY: 0,
        sqW: 410, sqH: 420,
        debris: []  // {orbitR, angle, angleSpeed, size, color}
      };
    },
    draw(p) {
      p.background(232, 220, 195);
      p.noStroke();
      p.fill(240, 230, 208);
      p.rect(40, 40, 520, 520);

      const s = this.state;
      // Ambient drift via noise
      const noiseX = (p.noise(p.frameCount * 0.005, 0) - 0.5) * 8;
      const noiseY = (p.noise(0, p.frameCount * 0.005) - 0.5) * 8;

      // Mouse repulsion
      const cx = s.baseX + s.offX + s.sqW/2;
      const cy = s.baseY + s.offY + s.sqH/2;
      const dx = cx - p.mouseX;
      const dy = cy - p.mouseY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const force = Math.max(0, 1 - dist/300);
      const repelX = (dx / (dist || 1)) * force * 1.2;
      const repelY = (dy / (dist || 1)) * force * 1.2;

      // Spring back to center
      s.velX += repelX - s.offX * 0.02 + noiseX * 0.01;
      s.velY += repelY - s.offY * 0.02 + noiseY * 0.01;
      s.velX *= 0.88;
      s.velY *= 0.88;
      s.offX += s.velX;
      s.offY += s.velY;

      // Big square
      p.fill(18, 18, 16);
      p.rect(s.baseX + s.offX, s.baseY + s.offY, s.sqW, s.sqH);

      // Orbiting debris — each circles the center of the big square
      const sqCx = s.baseX + s.offX + s.sqW/2;
      const sqCy = s.baseY + s.offY + s.sqH/2;
      for (const d of s.debris) {
        d.angle += d.angleSpeed;
        const dx2 = Math.cos(d.angle) * d.orbitR;
        const dy2 = Math.sin(d.angle) * d.orbitR;
        p.push();
        p.translate(sqCx + dx2, sqCy + dy2);
        p.rotate(d.angle * 1.5);
        p.fill(d.color[0], d.color[1], d.color[2]);
        p.rect(-d.size/2, -d.size/2, d.size, d.size);
        p.pop();
      }
    },
    mousePressed(p) {
      // Spawn debris at click point — orbiting the square center
      const s = this.state;
      const sqCx = s.baseX + s.offX + s.sqW/2;
      const sqCy = s.baseY + s.offY + s.sqH/2;
      const dx = p.mouseX - sqCx;
      const dy = p.mouseY - sqCy;
      const orbitR = Math.sqrt(dx*dx + dy*dy);
      const angle = Math.atan2(dy, dx);
      // Suprematist-ish palette for debris
      const palette = [[206,32,41],[20,50,140],[245,200,50],[18,18,16],[240,230,208]];
      s.debris.push({
        orbitR,
        angle,
        angleSpeed: (Math.random() < 0.5 ? -1 : 1) * (0.005 + Math.random() * 0.015),
        size: 12 + Math.random() * 28,
        color: palette[Math.floor(Math.random() * palette.length)]
      });
      // Cap at 12 to keep it composed
      if (s.debris.length > 12) s.debris.shift();
    }
  },

  // ============================================================
  // KANDINSKY — concentric circles rotate; hover pauses a cell
  // ============================================================
  {
    id: 'kandinsky',
    label: 'Kandinsky · 1913',
    title: 'Color Study: Squares with Concentric Circles',
    artist: 'Wassily Kandinsky, 1913',
    hint: 'Hover cell = pause its rotation · click cell = reverse direction',
    state: null,
    init(p) {
      this.state = {
        cols: 4, rows: 3,
        bgPalette: [
          [180,140,60],[60,80,120],[120,40,40],[40,100,70],
          [200,100,40],[80,60,100],[160,180,80],[40,60,90],
          [180,90,50],[230,200,70],[110,140,170],[60,40,40]
        ],
        ringPalettes: [
          [[60,90,150],[230,220,90],[200,80,40],[40,60,100],[230,200,150]],
          [[230,200,90],[200,60,40],[230,220,200],[80,40,30],[180,170,100]],
          [[30,40,80],[230,200,90],[200,80,50],[230,210,170],[60,80,30]],
          [[200,80,40],[40,60,90],[230,200,90],[230,220,200],[150,50,30]],
          [[40,60,90],[230,210,170],[180,60,40],[80,90,40],[230,200,90]],
          [[230,220,200],[200,80,40],[40,60,90],[230,200,90],[120,40,30]],
          [[40,60,90],[200,80,40],[230,200,90],[60,90,40],[230,210,170]],
          [[230,200,90],[40,60,90],[230,220,200],[200,80,40],[80,40,30]],
          [[230,210,170],[40,60,90],[230,200,90],[200,80,40],[60,90,40]],
          [[40,60,90],[230,200,90],[200,80,40],[230,210,170],[30,40,80]],
          [[230,200,90],[200,80,40],[40,60,90],[230,210,170],[120,40,30]],
          [[200,80,40],[230,200,90],[40,60,90],[230,210,170],[60,90,40]]
        ],
        cellPhase: Array.from({length:12}, () => Math.random() * Math.PI * 2),
        cellSpeed: Array.from({length:12}, () => 0.003 + Math.random() * 0.008),
        cellWobble: Array.from({length:12}, () => 0.5 + Math.random() * 0.5),
        cellDir: Array.from({length:12}, () => 1)  // +1 or -1
      };
    },
    draw(p) {
      p.background(235, 228, 210);
      const s = this.state;
      const cw = W / s.cols, ch = H / s.rows;
      p.noStroke();

      // Determine which cell mouse is over
      const hoverCol = Math.floor(p.mouseX / cw);
      const hoverRow = Math.floor(p.mouseY / ch);
      const hoverIdx = (p.mouseX >= 0 && p.mouseX < W && p.mouseY >= 0 && p.mouseY < H)
        ? hoverRow * s.cols + hoverCol : -1;

      for (let i = 0; i < s.cols; i++) {
        for (let j = 0; j < s.rows; j++) {
          const idx = j * s.cols + i;
          const x = i * cw, y = j * ch;
          const cx = x + cw/2, cy = y + ch/2;

          const bg = s.bgPalette[idx];
          p.fill(bg[0], bg[1], bg[2]);
          p.rect(x, y, cw, ch);

          if (idx !== hoverIdx) {
            s.cellPhase[idx] += s.cellSpeed[idx] * s.cellDir[idx];
          }

          const phase = s.cellPhase[idx];
          const wob = s.cellWobble[idx] * 8;
          const ox = Math.cos(phase) * wob;
          const oy = Math.sin(phase) * wob;

          const rings = s.ringPalettes[idx];
          let r = Math.min(cw, ch) * 0.45;
          const pulse = 1 + Math.sin(phase * 1.5) * 0.04;
          for (let k = 0; k < rings.length; k++) {
            p.fill(rings[k][0], rings[k][1], rings[k][2]);
            const ringR = r * pulse * (1 - k * 0.28);
            const ringOx = ox * (1 - k * 0.15);
            const ringOy = oy * (1 - k * 0.15);
            p.ellipse(cx + ringOx, cy + ringOy, ringR*2, ringR*2);
          }

          if (idx === hoverIdx) {
            p.noFill();
            p.stroke(20, 20, 20, 100);
            p.strokeWeight(2);
            p.rect(x+1, y+1, cw-2, ch-2);
            p.noStroke();
          }
        }
      }
    },
    mousePressed(p) {
      const s = this.state;
      const cw = W / s.cols, ch = H / s.rows;
      const col = Math.floor(p.mouseX / cw);
      const row = Math.floor(p.mouseY / ch);
      if (col < 0 || col >= s.cols || row < 0 || row >= s.rows) return;
      const idx = row * s.cols + col;
      s.cellDir[idx] *= -1;
    }
  },

  // ============================================================
  // KLEE — Castle and Sun, sun radiates warmth, click drops new sun
  // ============================================================
  {
    id: 'klee',
    label: 'Klee · 1928',
    title: 'Castle and Sun',
    artist: 'Paul Klee, 1928',
    hint: 'Mouse hover bleeds warmth · click drops sun · shift-click drops cooling moon',
    state: null,
    init(p) {
      // Build tile grid once
      const palette = [
        [180,60,50],[200,80,40],[220,140,60],[180,120,40],
        [80,100,60],[100,80,50],[60,80,90],[40,60,80],
        [180,90,80],[210,160,90],[140,80,60],[90,110,80],
        [200,170,100],[160,100,70],[70,90,110],[180,140,80]
      ];
      const tiles = [];
      const cellW = 50, cellH = 50;
      let seed = 42;
      const rnd = () => {
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
      };
      for (let y = 80; y < 560; y += cellH) {
        for (let x = 20; x < 580; x += cellW) {
          const baseColor = palette[Math.floor(rnd() * palette.length)];
          const shapeRoll = rnd();
          tiles.push({
            x, y, w: cellW, h: cellH,
            baseColor,
            shape: shapeRoll < 0.7 ? 'rect' : (shapeRoll < 0.85 ? 'tri-up' : 'tri-down'),
            jitterX: rnd() * 4,
            jitterY: rnd() * 4,
            wJit: rnd() * 6 + 2,
            hJit: rnd() * 6 + 2
          });
        }
      }
      this.state = {
        tiles,
        suns: [{ x: 440, y: 140, r: 45, born: 0 }],
        moons: [],
        towers: [
          { x:120, y:40, w:50, h:60, color:[180,60,50], roof:[140,80,60] },
          { x:260, y:30, w:50, h:70, color:[220,140,60], roof:[60,80,90] },
          { x:360, y:50, w:50, h:50, color:[80,100,60], roof:null }
        ]
      };
    },
    draw(p) {
      p.background(60, 50, 70);
      const s = this.state;
      const t = p.frameCount;

      p.noStroke();
      // Warmth from suns + cooling from moons
      const sunColor = [240, 180, 80];
      const moonColor = [80, 110, 180];
      for (const tile of s.tiles) {
        const tcx = tile.x + tile.w/2;
        const tcy = tile.y + tile.h/2;

        let warmth = 0;
        for (const sun of s.suns) {
          const dx = tcx - sun.x, dy = tcy - sun.y;
          const d = Math.sqrt(dx*dx + dy*dy);
          const pulse = 0.7 + 0.3 * Math.sin(t * 0.03 + d * 0.02);
          warmth = Math.max(warmth, Math.max(0, 1 - d / 280) * pulse);
        }
        let cool = 0;
        for (const moon of s.moons) {
          const dx = tcx - moon.x, dy = tcy - moon.y;
          const d = Math.sqrt(dx*dx + dy*dy);
          const pulse = 0.7 + 0.3 * Math.sin(t * 0.025 + d * 0.02 + 1);
          cool = Math.max(cool, Math.max(0, 1 - d / 280) * pulse);
        }

        let col = lerpRGB(tile.baseColor, sunColor, warmth * 0.55);
        col = lerpRGB(col, moonColor, cool * 0.55);
        p.fill(col[0], col[1], col[2]);

        if (tile.shape === 'rect') {
          p.rect(tile.x + tile.jitterX, tile.y + tile.jitterY,
                 tile.w - tile.wJit, tile.h - tile.hJit);
        } else if (tile.shape === 'tri-up') {
          p.triangle(tile.x, tile.y + tile.h,
                     tile.x + tile.w, tile.y + tile.h,
                     tile.x + tile.w/2, tile.y);
        } else {
          p.triangle(tile.x, tile.y,
                     tile.x + tile.w, tile.y,
                     tile.x + tile.w/2, tile.y + tile.h);
        }
      }

      // Towers
      for (const tw of s.towers) {
        p.fill(tw.color[0], tw.color[1], tw.color[2]);
        p.rect(tw.x, tw.y, tw.w, tw.h);
        if (tw.roof) {
          p.fill(tw.roof[0], tw.roof[1], tw.roof[2]);
          p.triangle(tw.x, tw.y, tw.x + tw.w, tw.y, tw.x + tw.w/2, tw.y - 30);
        }
      }

      // Suns
      for (const sun of s.suns) {
        const pulse = 1 + Math.sin(t * 0.04) * 0.05;
        for (let g = 6; g >= 1; g--) {
          p.fill(240, 180, 80, 12);
          p.ellipse(sun.x, sun.y, sun.r * 2 * pulse + g * 14, sun.r * 2 * pulse + g * 14);
        }
        p.fill(220, 60, 50);
        p.ellipse(sun.x, sun.y, sun.r * 2 * pulse, sun.r * 2 * pulse);
      }
      // Moons
      for (const moon of s.moons) {
        const pulse = 1 + Math.sin(t * 0.035 + 1) * 0.05;
        for (let g = 6; g >= 1; g--) {
          p.fill(80, 110, 180, 12);
          p.ellipse(moon.x, moon.y, moon.r * 2 * pulse + g * 14, moon.r * 2 * pulse + g * 14);
        }
        // Crescent feel: full disc then a darker bite
        p.fill(200, 215, 235);
        p.ellipse(moon.x, moon.y, moon.r * 2 * pulse, moon.r * 2 * pulse);
        p.fill(60, 50, 70);
        p.ellipse(moon.x + moon.r * 0.45, moon.y - moon.r * 0.1,
                  moon.r * 1.6 * pulse, moon.r * 1.6 * pulse);
      }
    },
    mousePressed(p) {
      const shift = p.keyIsDown(16); // SHIFT keycode
      if (shift) {
        this.state.moons.push({
          x: p.mouseX, y: p.mouseY, r: 32, born: p.frameCount
        });
        if (this.state.moons.length > 4) this.state.moons.shift();
      } else {
        this.state.suns.push({
          x: p.mouseX, y: p.mouseY, r: 35, born: p.frameCount
        });
        if (this.state.suns.length > 4) this.state.suns.shift();
      }
    }
  },

  // ============================================================
  // MOHOLY-NAGY — kinetic construction, parallax on mouse
  // ============================================================
  {
    id: 'moholy',
    label: 'Moholy-Nagy · 1922',
    title: 'A II (Construction)',
    artist: 'László Moholy-Nagy, 1922',
    hint: 'Mouse parallaxes layers · click to freeze / unfreeze composition',
    state: null,
    init(p) {
      this.state = {
        targetMX: W/2, targetMY: H/2,
        smoothMX: W/2, smoothMY: H/2,
        frozen: false,
        // when frozen, stash the time + smoothed mouse so view stays static
        frozenT: 0,
        frozenPX: 0,
        frozenPY: 0
      };
    },
    draw(p) {
      p.background(225, 215, 195);
      const s = this.state;

      // Time and parallax — either live or frozen snapshot
      let t, px, py;
      if (s.frozen) {
        t = s.frozenT;
        px = s.frozenPX;
        py = s.frozenPY;
      } else {
        t = p.frameCount;
        const mx = (p.mouseX >= 0 && p.mouseX <= W) ? p.mouseX : W/2;
        const my = (p.mouseY >= 0 && p.mouseY <= H) ? p.mouseY : H/2;
        s.smoothMX += (mx - s.smoothMX) * 0.06;
        s.smoothMY += (my - s.smoothMY) * 0.06;
        px = (s.smoothMX - W/2) / (W/2);
        py = (s.smoothMY - H/2) / (H/2);
      }

      p.noStroke();

      // Yellow circle
      p.push();
      p.translate(380 + px * 8, 220 + py * 8);
      const breath1 = 1 + Math.sin(t * 0.012) * 0.02;
      p.fill(225, 175, 50, 230);
      p.ellipse(0, 0, 240 * breath1, 240 * breath1);
      p.pop();

      // Black diagonal bar
      p.push();
      p.translate(300 + px * 14, 300 + py * 14);
      p.rotate(-0.5 + Math.sin(t * 0.006) * 0.04);
      p.fill(25, 25, 30);
      p.rect(-260, -22, 520, 44);
      p.pop();

      // Red rectangle
      p.push();
      p.translate(310 + px * 20, 250 + py * 20);
      p.rotate(0.15 + Math.cos(t * 0.008) * 0.03);
      p.fill(180, 40, 35, 235);
      p.rect(-150, -50, 300, 100);
      p.pop();

      // Blue rectangle
      p.push();
      p.translate(280 + px * 26, 400 + py * 26);
      p.rotate(-0.25 + Math.sin(t * 0.005 + 1) * 0.05);
      p.fill(30, 55, 110, 230);
      p.rect(-180, -30, 360, 60);
      p.pop();

      // Crossing lines
      p.stroke(25, 25, 30); p.strokeWeight(3);
      p.line(40 + px*32, 520 + py*32, 560 + px*32, 80 + py*32);
      p.line(60 + px*32, 80 + py*32, 540 + px*32, 540 + py*32);
      p.noStroke();

      // White accent circle
      p.fill(240, 235, 225);
      const breath2 = 1 + Math.sin(t * 0.02 + 2) * 0.06;
      p.ellipse(180 + px * 38, 460 + py * 38, 50 * breath2, 50 * breath2);

      // Tiny black square
      p.push();
      p.translate(480 + px * 42, 480 + py * 42);
      p.rotate(t * 0.004);
      p.fill(25, 25, 30);
      p.rect(-15, -15, 30, 30);
      p.pop();

      // Frozen indicator
      if (s.frozen) {
        p.noStroke();
        p.fill(25, 25, 30, 180);
        p.rect(W - 18, H - 18, 10, 10);
      }
    },
    mousePressed(p) {
      const s = this.state;
      if (!s.frozen) {
        // Capture current state
        s.frozen = true;
        s.frozenT = p.frameCount;
        s.frozenPX = (s.smoothMX - W/2) / (W/2);
        s.frozenPY = (s.smoothMY - H/2) / (H/2);
      } else {
        s.frozen = false;
      }
    }
  },

  // ============================================================
  // DELAUNAY — Orphic concentric discs, rotate like gears
  // ============================================================
  {
    id: 'delaunay',
    label: 'Delaunay · 1938',
    title: 'Rhythm (Orphic discs)',
    artist: 'Sonia Delaunay, 1938',
    hint: 'Mouse X = rotation speed · mouse Y = direction · click reseeds',
    state: null,
    init(p) {
      // Three large discs, each with concentric color rings as "gear teeth"
      // Plus smaller satellite discs
      const ringPalette = [
        [220,60,50],[230,180,50],[40,90,150],[230,220,200],
        [180,60,120],[60,140,90],[220,120,40],[20,30,60]
      ];
      const shuffled = () => {
        const a = [...ringPalette];
        for (let i = a.length-1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i+1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };
      this.state = {
        discs: [
          { cx: 200, cy: 220, radius: 160, rings: shuffled().slice(0,6), phase: 0, baseSpeed: 1 },
          { cx: 420, cy: 380, radius: 140, rings: shuffled().slice(0,5), phase: 0, baseSpeed: -1.4 },
          { cx: 300, cy: 480, radius: 90, rings: shuffled().slice(0,4), phase: 0, baseSpeed: 1.8 },
          { cx: 490, cy: 130, radius: 70, rings: shuffled().slice(0,4), phase: 0, baseSpeed: -2.2 },
          { cx: 90, cy: 480, radius: 55, rings: shuffled().slice(0,3), phase: 0, baseSpeed: 2.6 }
        ]
      };
    },
    draw(p) {
      p.background(238, 230, 215);
      const s = this.state;

      // Mouse X controls speed magnitude, mouse Y flips direction smoothly
      const mx = (p.mouseX >= 0 && p.mouseX <= W) ? p.mouseX : W/2;
      const my = (p.mouseY >= 0 && p.mouseY <= H) ? p.mouseY : H/2;
      const speedMag = mx / W; // 0..1
      const dirSign = my < H/2 ? 1 : -1;

      p.noStroke();
      for (const disc of s.discs) {
        disc.phase += 0.015 * disc.baseSpeed * speedMag * dirSign;

        // Draw concentric rings, but each ring is split into colored arcs (gear-tooth feel)
        const segments = 8;
        const ringCount = disc.rings.length;
        for (let r = 0; r < ringCount; r++) {
          const radius = disc.radius * (1 - r / ringCount);
          const innerR = disc.radius * (1 - (r+1) / ringCount);
          const ringColor = disc.rings[r];
          // Alternating: solid ring vs segmented ring for visual rhythm
          if (r % 2 === 0) {
            // Solid ring
            p.fill(ringColor[0], ringColor[1], ringColor[2]);
            p.ellipse(disc.cx, disc.cy, radius * 2, radius * 2);
          } else {
            // Segmented ring — draw pie slices alternating with previous ring color
            const altColor = disc.rings[(r - 1 + ringCount) % ringCount];
            for (let seg = 0; seg < segments; seg++) {
              const a1 = disc.phase + (seg / segments) * Math.PI * 2;
              const a2 = disc.phase + ((seg+1) / segments) * Math.PI * 2;
              const useAlt = seg % 2 === 0;
              const c = useAlt ? altColor : ringColor;
              p.fill(c[0], c[1], c[2]);
              p.beginShape();
              p.vertex(disc.cx, disc.cy);
              // Arc approximated with vertices
              const steps = 6;
              for (let st = 0; st <= steps; st++) {
                const a = a1 + (a2 - a1) * (st / steps);
                p.vertex(disc.cx + Math.cos(a) * radius, disc.cy + Math.sin(a) * radius);
              }
              p.endShape(p.CLOSE);
            }
          }
        }
        // Innermost solid center
        const inner = disc.rings[disc.rings.length - 1];
        p.fill(inner[0], inner[1], inner[2]);
        const cr = disc.radius * (1 / disc.rings.length) * 0.6;
        p.ellipse(disc.cx, disc.cy, cr * 2, cr * 2);
      }
    },
    mousePressed(p) {
      // Reseed colors
      const ringPalette = [
        [220,60,50],[230,180,50],[40,90,150],[230,220,200],
        [180,60,120],[60,140,90],[220,120,40],[20,30,60]
      ];
      const shuffled = () => {
        const a = [...ringPalette];
        for (let i = a.length-1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i+1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };
      for (const disc of this.state.discs) {
        disc.rings = shuffled().slice(0, disc.rings.length);
      }
    }
  },

  // ============================================================
  // VAN DOESBURG — Counter-Composition; mouseX tilts the grid
  // ============================================================
  {
    id: 'vandoesburg',
    label: 'van Doesburg · 1924',
    title: 'Counter-Composition V',
    artist: 'Theo van Doesburg, 1924',
    hint: 'Mouse X = grid tilt angle · click to lock/unlock auto-sway',
    state: null,
    init(p) {
      this.state = {
        autoSway: true,
        manualAngle: 0,
        // Geometric blocks defined in un-rotated grid space, centered at canvas center
        // Van Doesburg's signature: large white field with diagonal black bars and a few color blocks
        blocks: [
          // big black diagonal bar across upper area
          { x: -340, y: -240, w: 680, h: 70, color: [20,20,22] },
          // thinner black bar lower
          { x: -340, y:  60, w: 680, h: 40, color: [20,20,22] },
          // vertical black bar
          { x: -60, y: -340, w: 50, h: 680, color: [20,20,22] },
          // red square upper right
          { x:  140, y: -200, w: 120, h: 120, color: [200,45,40] },
          // blue rectangle lower left
          { x: -280, y:  140, w: 160, h: 80, color: [30,55,140] },
          // yellow accent
          { x:   60, y:  180, w: 70, h: 70, color: [230,195,55] }
        ]
      };
    },
    draw(p) {
      p.background(238, 232, 218);
      const s = this.state;
      const t = p.frameCount;

      // Determine tilt angle
      let angle;
      if (s.autoSway) {
        // Slow oscillation between -45° and -30° (van Doesburg's signature ~45° tilt)
        angle = -Math.PI/4 + Math.sin(t * 0.008) * 0.12;
      } else {
        // Manual: mouseX maps to -75°..-15° range
        const mx = (p.mouseX >= 0 && p.mouseX <= W) ? p.mouseX : W/2;
        const t01 = mx / W;
        angle = -Math.PI/4 + (t01 - 0.5) * Math.PI / 3; // ±30° around -45°
        s.manualAngle = angle;
      }

      p.push();
      p.translate(W/2, H/2);
      p.rotate(angle);
      p.noStroke();

      // White ground (rotated) — large enough to cover canvas at any angle
      p.fill(238, 232, 218);
      p.rect(-500, -500, 1000, 1000);

      // Draw blocks
      for (const b of s.blocks) {
        p.fill(b.color[0], b.color[1], b.color[2]);
        p.rect(b.x, b.y, b.w, b.h);
      }
      p.pop();

      // Indicator: tiny mode badge in corner (subtle)
      p.noStroke();
      p.fill(20, 20, 22, s.autoSway ? 60 : 140);
      p.rect(W - 18, H - 18, 10, 10);
    },
    mousePressed(p) {
      this.state.autoSway = !this.state.autoSway;
    }
  },

  // ============================================================
  // ALBERS — colors cycle through historical palettes; mouseY = speed
  // ============================================================
  {
    id: 'albers',
    label: 'Albers · 1959',
    title: 'Homage to the Square',
    artist: 'Josef Albers, c. 1959',
    hint: 'Move mouse up/down — speed of color cycling · click to jump',
    state: null,
    init(p) {
      // Historical Albers palettes, each: [outer, mid1, mid2, inner]
      this.state = {
        palettes: [
          // Warm ochre
          [[180,130,50],[210,165,70],[225,200,110],[240,230,170]],
          // Cool blue
          [[40,60,95],[70,100,140],[130,170,200],[200,220,230]],
          // Olive/sage
          [[90,100,60],[140,150,90],[180,180,120],[220,215,170]],
          // Red/orange heat
          [[140,40,30],[200,80,40],[220,140,80],[240,200,140]],
          // Grayscale
          [[40,40,40],[100,100,100],[170,170,170],[230,230,225]],
          // Earth/terracotta
          [[110,50,40],[170,90,60],[210,150,100],[235,210,170]],
          // Forest
          [[30,60,40],[60,100,70],[120,160,110],[200,220,180]]
        ],
        currentIdx: 0,
        nextIdx: 1,
        progress: 0,  // 0..1 transition
        speed: 0.003
      };
    },
    draw(p) {
      p.noStroke();
      const s = this.state;

      // mouseY controls speed (top=slow, bottom=fast)
      const my = Math.max(0, Math.min(H, p.mouseY));
      s.speed = 0.0008 + (my / H) * 0.012;
      s.progress += s.speed;
      if (s.progress >= 1) {
        s.progress = 0;
        s.currentIdx = s.nextIdx;
        s.nextIdx = (s.nextIdx + 1) % s.palettes.length;
      }

      // Interpolate between current and next palette
      const cur = s.palettes[s.currentIdx];
      const nxt = s.palettes[s.nextIdx];
      const t = s.progress;
      // Ease in-out for smoother feel
      const eased = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;

      const colors = cur.map((c, i) => lerpRGB(c, nxt[i], eased));

      // 4 nested squares, sinking down (Albers signature)
      // Outer fills entire canvas
      p.fill(colors[0][0], colors[0][1], colors[0][2]);
      p.rect(0, 0, W, H);

      // Inner squares: equal side margins, top margin < bottom margin
      const configs = [
        { side: 60, topRatio: 0.7 },
        { side: 120, topRatio: 0.7 },
        { side: 180, topRatio: 0.7 }
      ];
      for (let i = 0; i < 3; i++) {
        const { side, topRatio } = configs[i];
        const top = side * topRatio;
        const bottom = side * (2 - topRatio);
        p.fill(colors[i+1][0], colors[i+1][1], colors[i+1][2]);
        p.rect(side, top, W - 2*side, H - top - bottom);
      }
    },
    mousePressed(p) {
      // Jump to next palette
      this.state.currentIdx = this.state.nextIdx;
      this.state.nextIdx = (this.state.nextIdx + 1) % this.state.palettes.length;
      this.state.progress = 0;
    }
  }
];

// ============ App wiring ============
let current = 0;
let p5Instance;

const sketch = (p) => {
  p.setup = () => {
    const c = p.createCanvas(W, H);
    c.parent('canvas-wrap');
    paintings[current].init(p);
  };
  p.draw = () => {
    paintings[current].draw(p);
  };
  p.mousePressed = () => {
    // Only respond if click is inside canvas
    if (p.mouseX >= 0 && p.mouseX <= W && p.mouseY >= 0 && p.mouseY <= H) {
      paintings[current].mousePressed(p);
    }
  };
};

function selectPainting(i) {
  current = i;
  document.querySelectorAll('#controls button').forEach((b, idx) => {
    b.classList.toggle('active', idx === i);
  });
  paintings[i].init(p5Instance);
  updateCaption();
}

function buildControls() {
  const wrap = document.getElementById('controls');
  paintings.forEach((pt, i) => {
    const b = document.createElement('button');
    b.textContent = pt.label;
    if (i === 0) b.classList.add('active');
    b.addEventListener('click', () => selectPainting(i));
    wrap.appendChild(b);
  });
}

function updateCaption() {
  const cap = document.getElementById('caption');
  const pt = paintings[current];
  cap.innerHTML = `<strong>${pt.artist}</strong><br>${pt.title}<span class="hint">${pt.hint}</span>`;
}

buildControls();
updateCaption();
p5Instance = new p5(sketch);
</script>
