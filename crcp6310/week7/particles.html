<body>
<script>
/* =====================================================================
   SECTION 0 · TUNING CONSTANTS
   Everything you might want to tweak lives here or on a behavior object.
   All positions/velocities are in normalized [0,1] space on a square
   torus; only render() multiplies by the pixel size S.
   ===================================================================== */

const TAU = Math.PI * 2;

const K            = 6;      // species count (palette + coupling channels)
const TRAIL_ALPHA  = 0.14;   // per-frame fade; lower = longer trails
const PARTICLE_PER_PX = 900; // one particle per this many canvas pixels
const N_MIN = 300, N_MAX = 1000;

// Stream coupling
const STREAM_URL    = 'https://stream.wikimedia.org/v2/stream/recentchange';
const NOTABLE_BASE  = 700;   // byte-delta considered "notable" at coupling x1
const MAX_QUEUE     = 600;   // event backlog cap
const MAX_DRAIN     = 60;    // events processed per frame
const SIM_WIKIS = ['en.wikipedia.org', 'commons.wikimedia.org', 'www.wikidata.org',
                   'de.wikipedia.org', 'es.wikipedia.org', 'fr.wikipedia.org',
                   'ja.wikipedia.org'];

/* =====================================================================
   SECTION 1 · ENTROPY POOL
   A mulberry32 PRNG whose state is continuously perturbed by live edit
   metadata, so every stochastic draw in the piece (matrix rerolls,
   reseeds, walks) is seeded by the world's editing activity.
   ===================================================================== */

let poolState = (Date.now() >>> 0) || 1;

function rng() {
  poolState = (poolState + 0x6D2B79F5) | 0;
  let t = Math.imul(poolState ^ (poolState >>> 15), 1 | poolState);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

const rrange = (a, b) => a + (b - a) * rng();
const rint   = (n)    => Math.floor(rng() * n);

function mixEntropy(x) {
  poolState = (poolState ^ (x | 0)) >>> 0;
  poolState = Math.imul(poolState ^ (poolState >>> 13), 0x85EBCA6B) >>> 0;
}

/** FNV-1a string hash; maps wiki domains to stable species indices. */
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let k = 0; k < s.length; k++) {
    h ^= s.charCodeAt(k);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

/* =====================================================================
   SECTION 2 · CHROMATICS
   Species colors derive from ONE base hue through a harmony scheme, so
   the field reads as shades of a family. Arrow keys sweep the base hue;
   H cycles schemes. Colors are cached as p5.Color objects and rebuilt
   only when hue/scheme actually change (cheap fills in the hot loop).
   ===================================================================== */

const mod360 = (x) => ((x % 360) + 360) % 360;

const HARMONIES = [
  { name: 'Analogous',
    fn(K, base) {                              // K hues across a 120° arc
      const span = 120, out = [];
      for (let k = 0; k < K; k++) {
        const t = K > 1 ? k / (K - 1) : 0.5;
        out.push({ h: mod360(base + (t - 0.5) * span), s: 80, b: k % 2 ? 84 : 100 });
      }
      return out;
    } },
  { name: 'Complementary',
    fn(K, base) {                              // two clusters 180° apart
      const half = Math.ceil(K / 2), spread = 44, out = [];
      for (let k = 0; k < K; k++) {
        const inA = k < half;
        const cnt = inA ? half : K - half;
        const idx = inA ? k : k - half;
        const t   = cnt > 1 ? idx / (cnt - 1) : 0.5;
        out.push({ h: mod360(base + (inA ? 0 : 180) + (t - 0.5) * spread),
                   s: 80, b: k % 2 ? 84 : 100 });
      }
      return out;
    } },
  { name: 'Triadic',
    fn(K, base) {                              // three anchors, two tiers
      const out = [];
      for (let k = 0; k < K; k++) {
        out.push({ h: mod360(base + (k % 3) * 120), s: 80,
                   b: Math.floor(k / 3) === 0 ? 100 : 74 });
      }
      return out;
    } },
  { name: 'Split-Comp',
    fn(K, base) {                              // base + neighbors of complement
      const anchors = [0, 150, 210], out = [];
      for (let k = 0; k < K; k++) {
        out.push({ h: mod360(base + anchors[k % 3]), s: 80,
                   b: Math.floor(k / 3) === 0 ? 100 : 76 });
      }
      return out;
    } },
];

const HUE_SPEED = 2;                 // degrees per frame while arrow held
let baseHue = 210, harmonyIndex = 0;

let ph = [], ps = [], pb = [];       // raw HSB channels (HUD, physarum LUT)
let colCore = [], colGlow = [], colWalker = [];   // cached p5.Color objects
let fadeColor = null;                // cached trail-fade color
let paletteDirty = true;
let paletteVersion = 0;              // bumps on ANY palette change (hue or scheme)

function markPaletteDirty() { paletteDirty = true; }

function buildPalette() {
  if (!paletteDirty) return;
  paletteDirty = false;
  paletteVersion++;
  const cols = HARMONIES[harmonyIndex].fn(K, baseHue);
  ph = cols.map(c => c.h);
  ps = cols.map(c => c.s);
  pb = cols.map(c => c.b);
  colCore   = cols.map(c => color(c.h, c.s, c.b, 1));
  colGlow   = cols.map(c => color(c.h, c.s, c.b, 0.10));
  colWalker = cols.map(c => color(c.h, c.s, Math.max(30, c.b - 30), 0.30));
  fadeColor = color(0, 0, 3, TRAIL_ALPHA);
}

/* =====================================================================
   SECTION 3 · SHARED PARTICLE STATE
   Parallel arrays (Greenberg-style) shared by every behavior: position,
   velocity, species. Behaviors are free to reinterpret velocity (the
   membrane treats it as displacement; physarum ignores it for heading).
   ===================================================================== */

let S;                               // canvas size in pixels (square)
let N;                               // particle count
let px = [], py = [], vx = [], vy = [], sp = [];
let count = new Array(K).fill(0);    // live population per species

let paused = false, showMatrix = true;

/** Torus-aware shortest signed distance between two coordinates. */
const wrapD = (d) => (d > 0.5 ? d - 1 : (d < -0.5 ? d + 1 : d));

/** Wrap a single coordinate into [0,1). */
const wrap01 = (v) => (v < 0 ? v + 1 : (v >= 1 ? v - 1 : v));

function wrapAll() {
  for (let i = 0; i < N; i++) { px[i] = wrap01(px[i]); py[i] = wrap01(py[i]); }
}

function zeroVel() {
  for (let i = 0; i < N; i++) { vx[i] = 0; vy[i] = 0; }
}

function setSpecies(i, s) { count[sp[i]]--; sp[i] = s; count[s]++; }

function initParticles() {
  px = []; py = []; vx = []; vy = []; sp = [];
  for (let i = 0; i < N; i++) {
    px.push(rng()); py.push(rng());
    vx.push(0);     vy.push(0);
    sp.push(rint(K));
  }
  count.fill(0);
  for (let i = 0; i < N; i++) count[sp[i]]++;
  ensureBuffers();
}

function randomMatrix() {
  const m = [];
  for (let i = 0; i < K; i++) {
    const row = [];
    for (let j = 0; j < K; j++) row.push(rng() * 2 - 1);
    m.push(row);
  }
  return m;
}

/* =====================================================================
   SECTION 4 · SPATIAL GRID (shared neighbor index)
   One uniform grid serves every radius-based behavior. Cell width >=
   query radius, so a 3x3 cell scan provably covers the full radius
   (verified against brute force: 1.69M checks, zero misses). Linked
   lists over two Int32Arrays: O(N) build, O(k) query, zero allocation.
   ===================================================================== */

let CAND = new Int32Array(1);        // shared candidate scratch buffer

function ensureBuffers() {
  if (CAND.length < N) CAND = new Int32Array(N);
}

function makeGrid(cellSize) {
  const gN    = Math.max(1, Math.floor(1 / cellSize));
  const heads = new Int32Array(gN * gN);
  const next  = new Int32Array(N);

  const cellOf = (i) => {
    let gx = (px[i] * gN) | 0, gy = (py[i] * gN) | 0;
    if (gx < 0) gx = 0; else if (gx >= gN) gx = gN - 1;
    if (gy < 0) gy = 0; else if (gy >= gN) gy = gN - 1;
    return gy * gN + gx;
  };

  return {
    /** Re-bin every particle. Call once per frame before queries. */
    build() {
      heads.fill(-1);
      for (let i = 0; i < N; i++) {
        const c = cellOf(i);
        next[i] = heads[c];
        heads[c] = i;
      }
    },
    /** Fill CAND with neighbor candidates of particle i; returns count. */
    collect(i) {
      let gx = (px[i] * gN) | 0, gy = (py[i] * gN) | 0;
      if (gx < 0) gx = 0; else if (gx >= gN) gx = gN - 1;
      if (gy < 0) gy = 0; else if (gy >= gN) gy = gN - 1;
      let n = 0;
      for (let oy = -1; oy <= 1; oy++) {
        const cy = ((gy + oy) % gN + gN) % gN;
        for (let ox = -1; ox <= 1; ox++) {
          const cx = ((gx + ox) % gN + gN) % gN;
          for (let j = heads[cy * gN + cx]; j !== -1; j = next[j]) {
            if (j !== i) CAND[n++] = j;
          }
        }
      }
      return n;
    },
  };
}

/* =====================================================================
   SECTION 5 · STREAM COUPLING
   How the live signal touches the sim, at three timescales:
     continuous  — every edit converts a few particles to its project's
                   species, so the color MIX tracks active projects;
                   edit RATE feeds a smoothed `intensity` (tempo/energy)
     punctuated  — notable edits bloom + shockwave a real cluster of
                   their species (or a behavior's own coupleEvent)
     accumulated — all metadata folds into the entropy pool (Section 1)
   Coupling gain ([ ]) scales how hard the world pushes.
   ===================================================================== */

let liveInfluence = true;
let coupling      = 1.2;
let intensity = 0, intensityTarget = 0;
let lastEvent = null;                // {x, y, s, delta, wiki, t}

/** A few tries to find a particle of species s; falls back to any. */
function pickTargetOfSpecies(s) {
  for (let t = 0; t < 20; t++) {
    const i = rint(N);
    if (sp[i] === s) return i;
  }
  return rint(N);
}

/** Convert one random particle to species s (population-capped). */
function convertSpecies(s) {
  if (count[s] > 0.60 * N) return;
  const i = rint(N);
  if (sp[i] !== s) setSpecies(i, s);
}

/** Recolor every particle within a small radius to species s. */
function bloom(cx, cy, s) {
  if (count[s] > 0.70 * N) return;
  const r2 = 0.05 * 0.05;
  for (let i = 0; i < N; i++) {
    const dx = wrapD(px[i] - cx), dy = wrapD(py[i] - cy);
    if (dx * dx + dy * dy < r2 && sp[i] !== s) setSpecies(i, s);
  }
}

/** Radial impulse over a wide radius — shoves a crowd, not a dot. */
function shockwave(cx, cy, mag) {
  const R = 0.13;
  for (let i = 0; i < N; i++) {
    const dx = wrapD(px[i] - cx), dy = wrapD(py[i] - cy);
    const d = Math.hypot(dx, dy);
    if (d < R && d > 1e-5) {
      const w = mag * (1 - d / R) / d;
      vx[i] += dx * w;
      vy[i] += dy * w;
    }
  }
}

/* =====================================================================
   SECTION 6 · BEHAVIOR REGISTRY
   Uniform interface, mirroring Seisma's MOTIFS pattern:
     name, mapping — HUD labels
     kick          — shockwave strength scale for this physics
     enter()       — (re)initialize from current particle state
     reroll()      — R key
     step()        — one physics tick
     back()?       — drawn beneath particles (springs, wells...)
     render()?     — replaces the default particle renderer
     overlay()?    — drawn above particles (matrix, temperature)
     coupleEvent()?— owns its stream reading (crystalline, physarum)
   Adding a behavior = one object + one entry in BEHAVIORS.
   ===================================================================== */

/* ---- 6a · CELLULAR — asymmetric attraction ("Particle Life") -------
   Universal short-range repulsion; matrix-scaled mid-range attraction.
   Asymmetry (A[i][j] != A[j][i]) is what makes cells chase and orbit. */
const cellular = {
  name: 'Cellular', mapping: 'projects bloom & scatter cells',
  kick: 4.0,
  dt: 0.02, forceFactor: 10, rMax: 0.10, beta: 0.30,
  frict: Math.pow(0.5, 0.02 / 0.040),
  matrix: null, grid: null,

  enter() {
    zeroVel();
    this.matrix = randomMatrix();
    this.grid = makeGrid(this.rMax);
  },
  reroll() { this.matrix = randomMatrix(); },

  /** Piecewise force: r<beta repels (-1..0); beta..1 ramps by affinity a. */
  force(r, a) {
    if (r < this.beta) return r / this.beta - 1;
    if (r < 1) return a * (1 - Math.abs(2 * r - 1 - this.beta) / (1 - this.beta));
    return 0;
  },

  step() {
    const m = this.matrix, rMax = this.rMax, g = this.grid;
    g.build();
    for (let i = 0; i < N; i++) {
      let fx = 0, fy = 0;
      const xi = px[i], yi = py[i], row = m[sp[i]];
      const cnt = g.collect(i);
      for (let k = 0; k < cnt; k++) {
        const j = CAND[k];
        const rx = wrapD(px[j] - xi), ry = wrapD(py[j] - yi);
        const d = Math.sqrt(rx * rx + ry * ry);
        if (d > 0 && d < rMax) {
          const f = this.force(d / rMax, row[sp[j]]);
          fx += (rx / d) * f;
          fy += (ry / d) * f;
        }
      }
      vx[i] = vx[i] * this.frict + fx * rMax * this.forceFactor * this.dt;
      vy[i] = vy[i] * this.frict + fy * rMax * this.forceFactor * this.dt;
    }
    for (let i = 0; i < N; i++) { px[i] += vx[i] * this.dt; py[i] += vy[i] * this.dt; }
    wrapAll();
  },

  overlay() { if (showMatrix) drawMatrix(this.matrix); },
};

/* ---- 6b · FLOCKING — boids -----------------------------------------
   Separation / alignment / cohesion; edit rate scales cruise speed,
   notable edits shockwave-startle the murmuration. */
const flocking = {
  name: 'Flocking', mapping: 'edits startle · rate = speed',
  kick: 0.018,
  R1: 0.055, Rsep: 0.020,
  maxS: 0.0065, minS: 0.0035,
  wAlign: 0.06, wCoh: 0.020, wSep: 0.10,
  grid: null, nvx: null, nvy: null,

  enter() {
    this.grid = makeGrid(this.R1);
    this.nvx = new Float32Array(N);
    this.nvy = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const a = rng() * TAU;
      vx[i] = Math.cos(a) * this.maxS;
      vy[i] = Math.sin(a) * this.maxS;
    }
  },
  reroll() { this.enter(); },

  step() {
    const R1s = this.R1 * this.R1, Rss = this.Rsep * this.Rsep;
    const maxS = this.maxS * (0.5 + 0.9 * intensity);   // world busy -> faster
    const minS = this.minS * (0.5 + 0.9 * intensity);
    const g = this.grid, nvx = this.nvx, nvy = this.nvy;
    g.build();

    for (let i = 0; i < N; i++) {
      let alignX = 0, alignY = 0, cohX = 0, cohY = 0, sepX = 0, sepY = 0, cnt = 0;
      const xi = px[i], yi = py[i];
      const c = g.collect(i);
      for (let k = 0; k < c; k++) {
        const j = CAND[k];
        const dx = wrapD(px[j] - xi), dy = wrapD(py[j] - yi);
        const d2 = dx * dx + dy * dy;
        if (d2 >= R1s) continue;
        alignX += vx[j]; alignY += vy[j];
        cohX += dx;      cohY += dy;
        cnt++;
        if (d2 < Rss && d2 > 0) {
          const inv = 1 / Math.sqrt(d2);
          sepX -= dx * inv; sepY -= dy * inv;
        }
      }
      let nx = vx[i], ny = vy[i];
      if (cnt > 0) {
        nx += (alignX / cnt - vx[i]) * this.wAlign;
        ny += (alignY / cnt - vy[i]) * this.wAlign;
        nx += (cohX / cnt) * this.wCoh;
        ny += (cohY / cnt) * this.wCoh;
        nx += sepX * this.wSep * 0.001;
        ny += sepY * this.wSep * 0.001;
      }
      const mag = Math.hypot(nx, ny);
      if (mag > maxS)               { nx = nx / mag * maxS; ny = ny / mag * maxS; }
      else if (mag < minS && mag>0) { nx = nx / mag * minS; ny = ny / mag * minS; }
      nvx[i] = nx; nvy[i] = ny;
    }
    for (let i = 0; i < N; i++) {
      vx[i] = nvx[i]; vy[i] = nvy[i];
      px[i] += vx[i]; py[i] += vy[i];
    }
    wrapAll();
  },
};

/* ---- 6c · MEMBRANE — spring lattice ---------------------------------
   Freezes the current arrangement into a k-nearest-neighbor mesh; edits
   pluck nodes and waves ring through it. kNN build is a one-time cost
   at enter(), not per-frame. */
const membrane = {
  name: 'Membrane', mapping: 'edits pluck · rate = shimmer',
  kick: 0.030,
  nn: 3, k: 0.45, damp: 0.92,
  sa: null, sb: null, rest: null,

  enter() { zeroVel(); this.build(); },
  reroll() { this.enter(); },

  build() {
    const seen = new Set();
    const sa = [], sb = [], rest = [], nn = this.nn;
    for (let i = 0; i < N; i++) {
      const best = [];                          // nn nearest neighbors of i
      for (let j = 0; j < N; j++) {
        if (j === i) continue;
        const dx = wrapD(px[j] - px[i]), dy = wrapD(py[j] - py[i]);
        const d = Math.hypot(dx, dy);
        if (best.length < nn) {
          best.push({ j, d });
          best.sort((a, b) => a.d - b.d);
        } else if (d < best[nn - 1].d) {
          best[nn - 1] = { j, d };
          best.sort((a, b) => a.d - b.d);
        }
      }
      for (const b of best) {                   // dedupe undirected springs
        const a = Math.min(i, b.j), c = Math.max(i, b.j), key = a * N + c;
        if (!seen.has(key)) {
          seen.add(key);
          sa.push(a); sb.push(c); rest.push(b.d);
        }
      }
    }
    this.sa = sa; this.sb = sb; this.rest = rest;
  },

  step() {
    const { sa, sb, rest, k } = this;
    const ax = new Float32Array(N), ay = new Float32Array(N); // spring accel
    for (let s = 0; s < sa.length; s++) {
      const i = sa[s], j = sb[s];
      const dx = wrapD(px[j] - px[i]), dy = wrapD(py[j] - py[i]);
      const d = Math.hypot(dx, dy) || 1e-6;
      const f = k * (d - rest[s]) / d;          // Hooke, normalized direction
      ax[i] += f * dx; ay[i] += f * dy;
      ax[j] -= f * dx; ay[j] -= f * dy;
    }
    const shimmer = intensity * 0.0015;         // world busy -> restless mesh
    for (let i = 0; i < N; i++) {
      vx[i] = (vx[i] + ax[i]) * this.damp + (rng() * 2 - 1) * shimmer;
      vy[i] = (vy[i] + ay[i]) * this.damp + (rng() * 2 - 1) * shimmer;
      px[i] += vx[i]; py[i] += vy[i];
    }
    wrapAll();
  },

  back() {                                      // faint spring threads
    push();
    stroke(0, 0, 100, 0.10); strokeWeight(0.75);
    const { sa, sb } = this;
    for (let s = 0; s < sa.length; s++) {
      const i = sa[s], j = sb[s];
      const dx = wrapD(px[j] - px[i]), dy = wrapD(py[j] - py[i]);
      if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) continue;  // skip seam
      line(px[i] * S, py[i] * S, (px[i] + dx) * S, (py[i] + dy) * S);
    }
    pop();
  },
};

/* ---- 6d · CRYSTALLINE — DLA frost -----------------------------------
   Walkers random-walk and freeze on contact with crystal, adopting its
   color. Oldest frozen recycle to walkers, so it erodes at the roots
   while growing at the tips: a perpetual frost. Notable edits seed a
   nucleus of their project's species. */
const crystalline = {
  name: 'Crystalline', mapping: 'edits seed crystals · rate = growth',
  freezeDist: 0.011, stepBase: 0.004, capFrac: 0.5,
  frozen: null, grid: null, gridN: 0,
  order: [], frozenCount: 0, cap: 0,

  enter() {
    this.gridN = Math.max(8, Math.floor(1 / this.freezeDist));
    this.grid = new Array(this.gridN * this.gridN);
    for (let c = 0; c < this.grid.length; c++) this.grid[c] = [];
    this.frozen = new Uint8Array(N);
    this.frozenCount = 0;
    this.order = [];
    this.cap = Math.floor(N * this.capFrac);
    zeroVel();
    for (let k = 0; k < 4; k++) this.freezeAs(rint(N), rint(K));  // seed nuclei
  },
  reroll() { this.enter(); },

  cellIndex(x, y) {
    const gN = this.gridN;
    let gx = Math.floor(x * gN), gy = Math.floor(y * gN);
    gx = ((gx % gN) + gN) % gN;
    gy = ((gy % gN) + gN) % gN;
    return gy * gN + gx;
  },

  freezeAs(i, s) {
    if (this.frozen[i]) { setSpecies(i, s); return; }
    if (this.frozenCount >= this.cap) this.recycleOldest();
    setSpecies(i, s);
    this.frozen[i] = 1;
    this.grid[this.cellIndex(px[i], py[i])].push(i);
    this.order.push(i);
    this.frozenCount++;
    vx[i] = 0; vy[i] = 0;
  },

  recycleOldest() {
    while (this.order.length) {
      const idx = this.order.shift();
      if (!this.frozen[idx]) continue;
      this.frozen[idx] = 0;
      const arr = this.grid[this.cellIndex(px[idx], py[idx])];
      const p = arr.indexOf(idx);
      if (p >= 0) arr.splice(p, 1);
      this.frozenCount--;
      const a = rng() * TAU, r = this.freezeDist * 2.5;   // step off the crystal
      px[idx] = wrap01(px[idx] + Math.cos(a) * r);
      py[idx] = wrap01(py[idx] + Math.sin(a) * r);
      return;
    }
  },

  step() {
    const step = this.stepBase * (0.5 + intensity * 1.2); // busy world -> fast growth
    const fd2 = this.freezeDist * this.freezeDist, gN = this.gridN;
    for (let i = 0; i < N; i++) {
      if (this.frozen[i]) continue;
      px[i] = wrap01(px[i] + (rng() * 2 - 1) * step);
      py[i] = wrap01(py[i] + (rng() * 2 - 1) * step);
      // freeze check against crystal in the 3x3 surrounding cells
      const gx = Math.floor(px[i] * gN), gy = Math.floor(py[i] * gN);
      let stuck = -1;
      for (let oy = -1; oy <= 1 && stuck < 0; oy++) {
        for (let ox = -1; ox <= 1 && stuck < 0; ox++) {
          const cx = ((gx + ox) % gN + gN) % gN;
          const cy = ((gy + oy) % gN + gN) % gN;
          const arr = this.grid[cy * gN + cx];
          for (let a = 0; a < arr.length; a++) {
            const j = arr[a];
            const dx = wrapD(px[j] - px[i]), dy = wrapD(py[j] - py[i]);
            if (dx * dx + dy * dy < fd2) { stuck = j; break; }
          }
        }
      }
      if (stuck >= 0) this.freezeAs(i, sp[stuck]);
    }
  },

  coupleEvent(server, delta, s) {               // owns its stream reading
    if (Math.abs(delta) < NOTABLE_BASE / coupling) return;
    for (let t = 0; t < 30; t++) {
      const i = rint(N);
      if (this.frozen[i]) continue;
      this.freezeAs(i, s);                      // new nucleus, project's color
      lastEvent = { x: px[i], y: py[i], s, delta, wiki: server, t: millis() };
      return;
    }
  },

  render() {                                    // frozen bright, walkers faint
    for (let i = 0; i < N; i++) {
      const s = sp[i], x = px[i] * S, y = py[i] * S;
      if (this.frozen[i]) {
        fill(colGlow[s]); circle(x, y, 8);
        fill(colCore[s]); circle(x, y, 3.8);
      } else {
        fill(colWalker[s]); circle(x, y, 2.2);
      }
    }
  },
};

/* ---- 6e · THERMAL — agitation & crystallization ----------------------
   The odd one out: reads the stream GLOBALLY. Edit rate = temperature;
   busy world runs hot and gaseous, lulls freeze toward a lattice. */
const thermal = {
  name: 'Thermal', mapping: 'edit rate = temperature',
  kick: 0.030,
  T: 0.3, d0: 0.030, rC: 0.055, kC: 0.14,
  grid: null,

  enter() { zeroVel(); this.T = 0.3; this.grid = makeGrid(this.rC); },
  reroll() { zeroVel(); },

  step() {
    const target = liveInfluence ? constrain(eventsPerSec / 40, 0.05, 1.2) : 0.12;
    this.T += (target - this.T) * 0.05;         // smooth temperature tracking
    const noise = this.T * 0.011;
    const rC = this.rC, rC2 = rC * rC, d0 = this.d0, g = this.grid;
    g.build();
    for (let i = 0; i < N; i++) {
      let ax = 0, ay = 0;
      const xi = px[i], yi = py[i];
      const c = g.collect(i);
      for (let k = 0; k < c; k++) {
        const j = CAND[k];
        const dx = wrapD(px[j] - xi), dy = wrapD(py[j] - yi);
        const d2 = dx * dx + dy * dy;
        if (d2 < rC2 && d2 > 1e-9) {
          const d = Math.sqrt(d2);
          const f = this.kC * (d - d0) * (1 - d / rC) / d;  // spring toward d0
          ax += dx * f; ay += dy * f;
        }
      }
      vx[i] = (vx[i] + ax + (rng() * 2 - 1) * noise) * 0.90;
      vy[i] = (vy[i] + ay + (rng() * 2 - 1) * noise) * 0.90;
    }
    for (let i = 0; i < N; i++) { px[i] += vx[i]; py[i] += vy[i]; }
    wrapAll();
  },

  overlay() {
    push();
    fill(0, 0, 100, 0.5); textSize(11); textAlign(LEFT, TOP);
    const label = this.T > 0.6 ? 'hot' : (this.T > 0.3 ? 'warm' : 'cold');
    text('T = ' + this.T.toFixed(2) + '  (' + label + ')', 14, 14);
    pop();
  },
};

/* ---- 6f · PHYSARUM — slime-mold trail network ------------------------
   Jones model: agents sense the trail field at three points ahead, turn
   toward the strongest, deposit as they move. The FIELD is the art —
   diffuse + decay each frame yields glowing transport veins. Notable
   edits drop food; the network grows tendrils toward live activity. */
const physarum = {
  name: 'Physarum', mapping: 'edits drop food · network grows',
  G: 180,                     // trail-field resolution (biggest perf lever)
  stepLen: 0.0022, sensorDist: 0.013, sensorAngle: 0.45,
  rotate: 0.55, deposit: 1.0, decay: 0.90,
  field: null, tmp: null, lut: null, lutVersion: -1,
  gfx: null, head: null, foods: [],

  enter() {
    zeroVel();
    const G = this.G;
    if (!this.field || this.field.length !== G * G) {
      this.field = new Float32Array(G * G);
      this.tmp   = new Float32Array(G * G);
      this.lut   = new Float32Array(768);
      this.lutVersion = -1;
    } else {
      this.field.fill(0);
    }
    if (!this.gfx) { this.gfx = createGraphics(G, G); this.gfx.pixelDensity(1); }
    this.foods = [];
    this.head = new Float32Array(N);
    for (let i = 0; i < N; i++) this.head[i] = rng() * TAU;
  },
  reroll() { this.enter(); },

  sample(nx, ny) {
    const G = this.G;
    const x = nx - Math.floor(nx), y = ny - Math.floor(ny);
    let gx = (x * G) | 0, gy = (y * G) | 0;
    if (gx >= G) gx = G - 1;
    if (gy >= G) gy = G - 1;
    return this.field[gy * G + gx];
  },

  /** Deposit a soft radial blob of trail (food sources). */
  blob(nx, ny, amt) {
    const G = this.G, cx = (nx * G) | 0, cy = (ny * G) | 0, R = 4;
    for (let oy = -R; oy <= R; oy++) {
      for (let ox = -R; ox <= R; ox++) {
        const d2 = ox * ox + oy * oy;
        if (d2 > R * R) continue;
        const gx = ((cx + ox) % G + G) % G, gy = ((cy + oy) % G + G) % G;
        this.field[gy * G + gx] += amt * (1 - Math.sqrt(d2) / R);
      }
    }
  },

  step() {
    const G = this.G, f = this.field, tmp = this.tmp, H = this.head;
    const st = this.stepLen * (0.6 + intensity * 0.9);   // busy -> restless
    const sd = this.sensorDist, sa = this.sensorAngle;
    const rot = this.rotate, dep = this.deposit;

    // 1) sense -> turn -> move -> deposit
    for (let i = 0; i < N; i++) {
      const a = H[i], x = px[i], y = py[i];
      const fwd   = this.sample(x + Math.cos(a) * sd,      y + Math.sin(a) * sd);
      const left  = this.sample(x + Math.cos(a - sa) * sd, y + Math.sin(a - sa) * sd);
      const right = this.sample(x + Math.cos(a + sa) * sd, y + Math.sin(a + sa) * sd);
      let na = a;
      if (fwd >= left && fwd >= right) { /* keep heading */ }
      else if (left > right) na = a - rot;
      else if (right > left) na = a + rot;
      else na = a + (rng() < 0.5 ? rot : -rot);
      H[i] = na;
      const nx = wrap01(x + Math.cos(na) * st);
      const ny = wrap01(y + Math.sin(na) * st);
      px[i] = nx; py[i] = ny;
      let gx = (nx * G) | 0, gy = (ny * G) | 0;
      if (gx >= G) gx = G - 1;
      if (gy >= G) gy = G - 1;
      f[gy * G + gx] += dep;
    }

    // 2) food sources deposit and fade
    const now = millis();
    for (const fo of this.foods) { this.blob(fo.x, fo.y, fo.str); fo.str *= 0.985; }
    this.foods = this.foods.filter(fo => fo.str > 0.05 && now - fo.born < 7000);

    // 3) separable 3x3 box blur + decay (two passes over the field)
    const dec = this.decay;
    for (let y = 0; y < G; y++) {
      const yo = y * G;
      for (let x = 0; x < G; x++) {
        const l = (x - 1 + G) % G, r = (x + 1) % G;
        tmp[yo + x] = (f[yo + l] + f[yo + x] + f[yo + r]) / 3;
      }
    }
    for (let y = 0; y < G; y++) {
      const up = ((y - 1 + G) % G) * G, dn = ((y + 1) % G) * G, yo = y * G;
      for (let x = 0; x < G; x++) {
        f[yo + x] = ((tmp[up + x] + tmp[yo + x] + tmp[dn + x]) / 3) * dec;
      }
    }
  },

  coupleEvent(server, delta, s) {
    if (Math.abs(delta) < NOTABLE_BASE / coupling) return;
    const x = rng(), y = rng();
    this.foods.push({ x, y, born: millis(),
                      str: constrain(Math.abs(delta) / 1500, 0.4, 3) * coupling });
    lastEvent = { x, y, s, delta, wiki: server, t: millis() };
  },

  render() {
    const G = this.G, f = this.field, gp = this.gfx, lut = this.lut;
    // Rebuild the 256-entry LUT whenever the palette changes (hue OR scheme):
    // a gradient from near-black through the harmony's colors, ordered
    // dark -> bright, interpolated in RGB (so complementary pairs don't
    // sweep the hue wheel between stops). Trail intensity then reads as
    // position within the harmony: faint tendrils in its darker members,
    // bright vein cores in its brightest.
    if (this.lutVersion !== paletteVersion) {
      this.lutVersion = paletteVersion;
      const stops = [[8, 8, 12]];                       // near-black floor
      // Order stops by PERCEIVED luminance of the actual RGB (Rec. 709),
      // not HSB brightness — a b:100 blue is darker to the eye than a
      // b:84 yellow-green, and a non-monotonic ramp reads as flicker.
      const rgb = colCore.map(c => [red(c), green(c), blue(c)]);
      const lum = (c) => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
      const order = Array.from({ length: K }, (_, k) => k)
        .sort((a, b) => lum(rgb[a]) - lum(rgb[b]) || (a - b));
      for (const k of order) stops.push(rgb[k]);
      const segs = stops.length - 1;
      for (let l = 0; l < 256; l++) {
        const t  = (l / 255) * segs;
        const i0 = Math.min(segs - 1, t | 0);
        const fr = t - i0;
        const a = stops[i0], b = stops[i0 + 1];
        lut[l * 3]     = a[0] + (b[0] - a[0]) * fr;
        lut[l * 3 + 1] = a[1] + (b[1] - a[1]) * fr;
        lut[l * 3 + 2] = a[2] + (b[2] - a[2]) * fr;
      }
    }
    gp.loadPixels();
    const p8 = gp.pixels;
    for (let i = 0; i < G * G; i++) {
      let l = f[i] * 22;
      if (l > 255) l = 255;
      l = l | 0;
      const b = i * 4, o = l * 3;
      p8[b] = lut[o]; p8[b + 1] = lut[o + 1]; p8[b + 2] = lut[o + 2]; p8[b + 3] = 255;
    }
    gp.updatePixels();
    push(); imageMode(CORNER); image(gp, 0, 0, S, S); pop();
    push();                                     // faint agent specks
    stroke(0, 0, 100, 0.05); strokeWeight(1);
    for (let i = 0; i < N; i++) point(px[i] * S, py[i] * S);
    pop();
  },
};

const BEHAVIORS = [cellular, flocking, membrane, crystalline, thermal, physarum];
let behaviorIndex = 0;
const current = () => BEHAVIORS[behaviorIndex];

/* =====================================================================
   SECTION 7 · STREAM PLUMBING
   Native EventSource on the recentchange firehose; a synthetic SIM feed
   drives the identical pipeline if the stream can't connect, and yields
   the moment real events arrive.
   ===================================================================== */

let es = null, streamStatus = 'connecting';    // connecting | live | sim
let startMs = 0, simTimer = null;
let eventQueue = [];
let evCount = 0, eventsPerSec = 0, rateT = 0;

function connectStream() {
  try {
    es = new EventSource(STREAM_URL);
    es.onmessage = (e) => {
      if (streamStatus !== 'live') { streamStatus = 'live'; stopSim(); }
      try {
        const d = JSON.parse(e.data);
        if (d && d.meta && d.meta.domain === 'canary') return;  // health pings
        enqueue(d);
      } catch (_) { /* malformed frame — skip */ }
    };
    es.onerror = () => { /* EventSource auto-reconnects; watchdog covers the rest */ };
  } catch (_) {
    startSim();
  }
}

function startSim() {
  if (simTimer) return;
  streamStatus = 'sim';
  simTimer = setInterval(() => {
    const server = SIM_WIKIS[Math.floor(Math.random() * SIM_WIKIS.length)];
    const big = Math.random() < 0.24;
    const delta = Math.round((Math.random() * 2 - 1) * (big ? 2400 : 300));
    enqueue({ server_name: server,
              length: { old: 1000, new: 1000 + delta },
              title: 'Sim/' + Math.random().toString(36).slice(2, 8),
              user: 'Sim' + Math.floor(Math.random() * 9999), meta: {} });
  }, 120);
}

function stopSim() {
  if (simTimer) { clearInterval(simTimer); simTimer = null; }
}

function enqueue(d) {
  if (eventQueue.length < MAX_QUEUE) eventQueue.push(d);
  evCount++;
}

/** Process up to MAX_DRAIN queued edits: entropy, mix drift, notables. */
function drainEvents() {
  let n = Math.min(MAX_DRAIN, eventQueue.length);
  while (n-- > 0) {
    const d = eventQueue.shift();
    const server = d.server_name || d.wiki || '';
    let delta = 0;
    if (d.length && typeof d.length.new === 'number' && typeof d.length.old === 'number') {
      delta = d.length.new - d.length.old;
    }

    // accumulated: every edit feeds the entropy pool
    mixEntropy(delta);
    mixEntropy(hashStr(server));
    mixEntropy(d.title ? d.title.length : 0);
    mixEntropy(d.user ? hashStr(String(d.user)) : 0);

    if (!liveInfluence) continue;
    const s = hashStr(server) % K;

    // behaviors with their own stream reading take over here
    if (current().coupleEvent) { current().coupleEvent(server, delta, s); continue; }

    // continuous: species mix drifts toward active projects
    const conversions = Math.round((1 + Math.min(3, Math.floor(Math.abs(delta) / 1500))) * coupling);
    for (let c = 0; c < conversions; c++) convertSpecies(s);

    // punctuated: notable edits bloom + shockwave a cluster of their species
    if (Math.abs(delta) >= NOTABLE_BASE / coupling) {
      const i0 = pickTargetOfSpecies(s);
      const cx = px[i0], cy = py[i0];
      bloom(cx, cy, s);
      const size = constrain(Math.abs(delta) / 2500, 0.3, 1.6) * coupling;
      shockwave(cx, cy, current().kick * size);
      lastEvent = { x: cx, y: cy, s, delta, wiki: server, t: millis() };
    }
  }
}

/* =====================================================================
   SECTION 8 · RENDERING
   Default renderer batches particles by species (counting sort into a
   reused index buffer), so each frame costs ~2K fill state-changes
   instead of ~2N. Behaviors with a custom look override render().
   ===================================================================== */

let ORDER = new Int32Array(1);       // species-sorted particle indices
let STARTS = new Int32Array(K + 1);

function buildSpeciesOrder() {
  if (ORDER.length < N) ORDER = new Int32Array(N);
  STARTS[0] = 0;
  for (let k = 0; k < K; k++) STARTS[k + 1] = STARTS[k] + count[k];
  const cursor = STARTS.slice(0, K);
  for (let i = 0; i < N; i++) ORDER[cursor[sp[i]]++] = i;
}

function renderParticles() {
  buildSpeciesOrder();
  for (let k = 0; k < K; k++) {                 // glow layer, one fill per species
    fill(colGlow[k]);
    for (let o = STARTS[k]; o < STARTS[k + 1]; o++) {
      const i = ORDER[o];
      circle(px[i] * S, py[i] * S, 9);
    }
  }
  for (let k = 0; k < K; k++) {                 // core layer
    fill(colCore[k]);
    for (let o = STARTS[k]; o < STARTS[k + 1]; o++) {
      const i = ORDER[o];
      circle(px[i] * S, py[i] * S, 3.4);
    }
  }
}

/** Expanding ring + byte-delta label at the last notable edit. */
function drawEventMarker() {
  if (!lastEvent) return;
  const age = (millis() - lastEvent.t) / 1000;
  if (age > 1.2) return;
  const x = lastEvent.x * S, y = lastEvent.y * S, s = lastEvent.s;
  push();
  noFill();
  stroke(ph[s], ps[s], pb[s], 1 - age / 1.2);
  strokeWeight(2);
  circle(x, y, 10 + age * 0.13 * 2 * S);
  noStroke();
  fill(0, 0, 100, 0.85 * (1 - age / 1.2));
  textSize(11); textAlign(CENTER, BOTTOM);
  const sign = lastEvent.delta >= 0 ? '+' : '';
  text(sign + lastEvent.delta + '  ' + lastEvent.wiki.replace('.org', ''),
       x, y - 8 - age * 40);
  pop();
}

/** Cellular's interaction matrix: green attract, red repel. */
function drawMatrix(m) {
  const cell = 15, ox = 14, oy = 40;
  push();
  for (let k = 0; k < K; k++) {                 // species tabs
    fill(colCore[k]);
    rect(ox + (k + 1) * cell, oy, cell - 2, cell - 2);
    rect(ox, oy + (k + 1) * cell, cell - 2, cell - 2);
  }
  for (let i = 0; i < K; i++) {
    for (let j = 0; j < K; j++) {
      const v = m[i][j];
      fill(v >= 0 ? 150 : 0, 80, 25 + 70 * Math.min(1, Math.abs(v)), 1);
      rect(ox + (j + 1) * cell, oy + (i + 1) * cell, cell - 2, cell - 2);
    }
  }
  pop();
}

function drawHUD() {
  push();

  // stream status (top-right)
  const live = streamStatus === 'live', sim = streamStatus === 'sim';
  textAlign(RIGHT, TOP); textSize(12);
  fill(live ? 130 : (sim ? 40 : 0), 80, 95, 1);
  circle(S - 150, 20, 9);
  fill(0, 0, 100, 0.85);
  text((live ? 'LIVE' : sim ? 'SIM' : 'connecting') + '   ' + eventsPerSec + ' ev/s', S - 14, 14);
  fill(0, 0, 100, 0.45); textSize(10);
  text('coupling x' + coupling.toFixed(1) + (liveInfluence ? '' : '  (paused)'), S - 14, 34);

  // species-mix bar: segment widths are live populations (bottom-left)
  const bw = 150, bx = 14, by = S - 66, bh = 12;
  let cum = 0;
  for (let k = 0; k < K; k++) {
    const w = bw * count[k] / N;
    fill(colCore[k]);
    rect(bx + cum, by, Math.max(0, w - 0.5), bh);
    cum += w;
  }

  // labels + key help
  fill(0, 0, 100, 0.85); textSize(13); textAlign(LEFT, BOTTOM);
  text(current().name + '  \u2014  ' + current().mapping, 14, by - 6);
  fill(0, 0, 100, 0.5); textSize(11);
  text(HARMONIES[harmonyIndex].name + '  ·  hue ' + Math.round(baseHue) + '\u00B0', bx + bw + 10, S - 56);
  fill(0, 0, 100, 0.45);
  text('B behavior · \u2190\u2192 hue · H harmony · R reroll · Space pause', 14, S - 22);
  text('M matrix · C reseed · L stream · [ ] coupling · drag stir', 14, S - 8);
  pop();
}

/* =====================================================================
   SECTION 9 · p5 LIFECYCLE & INPUT
   ===================================================================== */

function setup() {
  S = Math.floor(Math.min(windowWidth, windowHeight));
  createCanvas(S, S);
  colorMode(HSB, 360, 100, 100, 1);
  noStroke();
  buildPalette();
  N = constrain(Math.round(S * S / PARTICLE_PER_PX), N_MIN, N_MAX);
  initParticles();
  current().enter();
  background(0, 0, 3);
  startMs = millis();
  rateT = millis();
  connectStream();
}

function draw() {
  // hue sweep while an arrow is held
  if (keyIsDown(LEFT_ARROW))  { baseHue = mod360(baseHue - HUE_SPEED); markPaletteDirty(); }
  if (keyIsDown(RIGHT_ARROW)) { baseHue = mod360(baseHue + HUE_SPEED); markPaletteDirty(); }
  buildPalette();

  // stream watchdog + once-a-second rate/intensity update
  if (streamStatus === 'connecting' && millis() - startMs > 4000) startSim();
  if (millis() - rateT > 1000) {
    eventsPerSec = evCount;
    evCount = 0;
    rateT = millis();
    intensityTarget = constrain(eventsPerSec / 35, 0, 1.5);
  }
  intensity += (intensityTarget - intensity) * 0.05;
  drainEvents();

  fill(fadeColor);                              // trail fade
  rect(0, 0, S, S);

  if (!paused) { current().step(); applyStir(); }
  if (current().back) current().back();
  if (current().render) current().render(); else renderParticles();
  drawEventMarker();
  if (current().overlay) current().overlay();
  drawHUD();
}

/** Drag: pull nearby particles toward the cursor (position-space). */
function applyStir() {
  if (!(mouseIsPressed && mouseX >= 0 && mouseX < S && mouseY >= 0 && mouseY < S)) return;
  const mx = mouseX / S, my = mouseY / S, R = 0.14;
  for (let i = 0; i < N; i++) {
    const dx = wrapD(mx - px[i]), dy = wrapD(my - py[i]);
    const d = Math.hypot(dx, dy);
    if (d < R) {
      const pull = 0.15 * (1 - d / R);
      px[i] += dx * pull;
      py[i] += dy * pull;
    }
  }
  wrapAll();
}

function keyPressed() {
  if (key === 'b' || key === 'B') {
    behaviorIndex = (behaviorIndex + 1) % BEHAVIORS.length;
    current().enter();
  }
  else if (key === 'r' || key === 'R') current().reroll();
  else if (key === ' ')                paused = !paused;
  else if (key === 'm' || key === 'M') showMatrix = !showMatrix;
  else if (key === 'c' || key === 'C') { initParticles(); current().enter(); }
  else if (key === 'h' || key === 'H') { harmonyIndex = (harmonyIndex + 1) % HARMONIES.length; markPaletteDirty(); }
  else if (key === 'l' || key === 'L') liveInfluence = !liveInfluence;
  else if (key === '[') coupling = Math.max(0.2, Math.round((coupling - 0.2) * 10) / 10);
  else if (key === ']') coupling = Math.min(3.0, Math.round((coupling + 0.2) * 10) / 10);
  if (keyCode === LEFT_ARROW || keyCode === RIGHT_ARROW) return false;  // no page scroll
}

function windowResized() {
  S = Math.floor(Math.min(windowWidth, windowHeight));
  resizeCanvas(S, S);
  N = constrain(Math.round(S * S / PARTICLE_PER_PX), N_MIN, N_MAX);
  initParticles();
  current().enter();
  background(0, 0, 3);
}
